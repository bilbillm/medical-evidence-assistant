services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${APP_PORT:-3000}:80"
    environment:
      VITE_API_BASE_URL: "http://localhost:${API_PORT:-3001}"
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "${API_PORT:-3001}:3001"
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql://postgres:postgres@db:5432/medical_evidence}"
      UPLOAD_DIR: "/app/data/uploads"
      GENERATED_DIR: "/app/data/generated"
      PROMPT_FILE: "/app/交接文档/交接文档/02_DEAP配置文案/deap_persona_integrated_prompt.md"
      KNOWLEDGE_DIR: "/app/交接文档/交接文档/03_知识库文件"
      LLM_PROVIDER: "${LLM_PROVIDER:-mock}"
      LLM_BASE_URL: "${LLM_BASE_URL:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-}"
      LLM_THINKING_ENABLED: "${LLM_THINKING_ENABLED:-true}"
      LLM_REASONING_EFFORT: "${LLM_REASONING_EFFORT:-high}"
      VISION_PROVIDER: "${VISION_PROVIDER:-mock}"
      VISION_BASE_URL: "${VISION_BASE_URL:-}"
      VISION_API_KEY: "${VISION_API_KEY:-}"
      VISION_MODEL: "${VISION_MODEL:-}"
      ALIYUN_ACCESS_KEY_ID: "${ALIYUN_ACCESS_KEY_ID:-}"
      ALIYUN_ACCESS_KEY_SECRET: "${ALIYUN_ACCESS_KEY_SECRET:-}"
      ALIYUN_OCR_ENDPOINT: "${ALIYUN_OCR_ENDPOINT:-ocr-api.cn-hangzhou.aliyuncs.com}"
      SPEECH_PROVIDER: "${SPEECH_PROVIDER:-mock}"
      SPEECH_BASE_URL: "${SPEECH_BASE_URL:-}"
      SPEECH_API_KEY: "${SPEECH_API_KEY:-}"
      SPEECH_MODEL: "${SPEECH_MODEL:-}"
      IFLYTEK_APP_ID: "${IFLYTEK_APP_ID:-}"
      IFLYTEK_API_KEY: "${IFLYTEK_API_KEY:-}"
      IFLYTEK_API_SECRET: "${IFLYTEK_API_SECRET:-}"
      IFLYTEK_IAT_HOST: "${IFLYTEK_IAT_HOST:-iat.xf-yun.com}"
      IFLYTEK_IAT_PATH: "${IFLYTEK_IAT_PATH:-/v1}"
      AI_REQUEST_TIMEOUT_MS: "${AI_REQUEST_TIMEOUT_MS:-60000}"
    volumes:
      - uploads:/app/data/uploads
      - generated:/app/data/generated
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: medical_evidence
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medical_evidence"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  uploads:
  generated:
  postgres-data:
